name: Run Minecraft Server

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Tự động chạy lại mỗi 6 tiếng
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make scripts executable
        run: chmod -R +x .

      - name: Run Minecraft Paper Server
        run: |
          echo "eula=true" > eula.txt
          java -Xms2G -Xmx6G -XX:+UseG1GC -jar server.jar nogui

      - name: Auto-save World and Server Data
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add world/ world_nether/ world_the_end/ plugins/
          git commit -m "Auto-save world and player data from cloud [skip ci]" || echo "No changes to commit"
          git push || echo "Push failed or nothing to push"

